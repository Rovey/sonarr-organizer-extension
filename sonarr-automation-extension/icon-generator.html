<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Icon Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #333;
        }
        .generator {
            margin: 20px 0;
            padding: 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
        }
        .icons {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        .icon-container {
            text-align: center;
        }
        canvas {
            border: 1px solid #ccc;
            display: block;
            margin: 10px auto;
        }
        button {
            background-color: #5cb85c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
        }
        button:hover {
            background-color: #4cae4c;
        }
        .instructions {
            background-color: #f5f5f5;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>Sonarr Extension Icon Generator</h1>

    <div class="instructions">
        <h3>Instructies:</h3>
        <ol>
            <li>Klik op de "Generate Icons" knop hieronder</li>
            <li>Klik op elke "Download" knop om de icons op te slaan</li>
            <li>Plaats de gedownloade bestanden in de sonarr-automation-extension map</li>
        </ol>
    </div>

    <div class="generator">
        <button onclick="generateIcons()">Generate Icons</button>

        <div class="icons" id="iconsContainer"></div>
    </div>

    <script>
        function generateIcons() {
            const sizes = [16, 48, 128];
            const container = document.getElementById('iconsContainer');
            container.innerHTML = '';

            sizes.forEach(size => {
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');

                // Draw background
                ctx.fillStyle = '#5cb85c';
                ctx.fillRect(0, 0, size, size);

                // Draw border
                ctx.strokeStyle = '#4cae4c';
                ctx.lineWidth = Math.max(1, size / 32);
                ctx.strokeRect(0, 0, size, size);

                // Draw letter 'S' for Sonarr
                ctx.fillStyle = 'white';
                ctx.font = `bold ${size * 0.6}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('S', size / 2, size / 2);

                // Create container
                const iconDiv = document.createElement('div');
                iconDiv.className = 'icon-container';

                const label = document.createElement('div');
                label.textContent = `${size}x${size}`;
                label.style.fontWeight = 'bold';
                label.style.marginBottom = '10px';

                const canvasClone = canvas.cloneNode(true);

                const downloadBtn = document.createElement('button');
                downloadBtn.textContent = 'Download';
                downloadBtn.onclick = () => downloadIcon(canvas, size);

                iconDiv.appendChild(label);
                iconDiv.appendChild(canvasClone);
                iconDiv.appendChild(downloadBtn);

                container.appendChild(iconDiv);
            });
        }

        function downloadIcon(canvas, size) {
            canvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `icon${size}.png`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            });
        }

        // Generate icons on page load
        window.addEventListener('load', generateIcons);
    </script>
</body>
</html>

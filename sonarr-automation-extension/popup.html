<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Sonarr Series Organizer</title>
  <link href="output.css" rel="stylesheet">
</head>
<body class="w-80 p-6 bg-gradient-to-br from-slate-50 to-slate-100 m-0">
  <div class="space-y-4">
    <!-- Header -->
    <div class="flex items-center gap-3 mb-2">
      <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center shadow-lg">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path>
        </svg>
      </div>
      <h1 class="text-xl font-bold text-slate-800">Sonarr Organizer</h1>
    </div>

    <!-- Description -->
    <p class="text-sm text-slate-600 leading-relaxed">
      This extension automatically opens all series, clicks "Preview Rename" and executes "Organize".
    </p>

    <!-- Warning Box (shown only when not on correct page) -->
    <div id="warningBox" style="display: none;" class="bg-amber-50 border-l-4 border-amber-400 p-3 rounded-r-lg shadow-sm">
      <div class="flex items-start gap-2">
        <svg class="w-5 h-5 text-amber-600 mt-0.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
        </svg>
        <p class="text-xs text-amber-800 font-medium">
          Please navigate to the Sonarr home page (/) showing all series before starting!
        </p>
      </div>
    </div>

    <!-- Buttons -->
    <div class="space-y-2">
      <button id="startBtn" class="w-full py-3 px-4 bg-gradient-to-r from-green-500 to-emerald-500 hover:from-green-600 hover:to-emerald-600 active:from-green-700 active:to-emerald-700 text-white font-semibold rounded-lg shadow-md hover:shadow-lg transition-all duration-200 transform hover:-translate-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none disabled:shadow-md cursor-pointer">
        Start Automation
      </button>
      <button id="stopBtn" style="display: none;" class="w-full py-3 px-4 bg-gradient-to-r from-red-500 to-rose-500 hover:from-red-600 hover:to-rose-600 active:from-red-700 active:to-rose-700 text-white font-semibold rounded-lg shadow-md hover:shadow-lg transition-all duration-200 transform hover:-translate-y-0.5 cursor-pointer">
        Stop Automation
      </button>
    </div>

    <!-- Status Box -->
    <div id="status" class="hidden mt-4 p-4 bg-white rounded-lg shadow-inner border border-slate-200 text-sm min-h-[60px] text-slate-700"></div>

    <!-- Debug Section -->
    <div class="pt-4 border-t border-slate-200">
      <button id="debugBtn" class="w-full py-2.5 px-4 bg-gradient-to-r from-cyan-500 to-blue-500 hover:from-cyan-600 hover:to-blue-600 text-white text-sm font-medium rounded-lg shadow-md hover:shadow-lg transition-all duration-200 transform hover:-translate-y-0.5 cursor-pointer">
        Show Debug Info
      </button>
      <div id="debugInfo" style="display: none;" class="mt-3 max-h-52 overflow-y-auto text-xs bg-slate-900 text-slate-100 p-3 rounded-lg shadow-inner border border-slate-700">
        <strong class="text-cyan-400">Debug Logs:</strong>
        <pre id="debugLogs" class="mt-2 whitespace-pre-wrap font-mono text-slate-300">No logs available</pre>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
